name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python3 scripts/build_airline_codes.py --check
      - run: python3 scripts/check_airline_logos.py
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # One job per browser: they run side by side instead of one after another,
  # and each keeps a single worker so timing checks stay uncontended.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-${{ matrix.project }}
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'webkit-mobile' && 'webkit' || matrix.project }}
        if: steps.browsers.outputs.cache-hit != 'true'
      - name: Install system dependencies only
        run: npx playwright install-deps ${{ matrix.project == 'webkit-mobile' && 'webkit' || matrix.project }}
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npx playwright test --project=${{ matrix.project }}
