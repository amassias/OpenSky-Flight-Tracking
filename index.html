<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Live air traffic map with airport departures and arrivals, aircraft photos, routes and altitude profiles." />
    <title>SkyTrace · Live flight tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkyTrace" />
    <meta property="og:title" content="SkyTrace · Live flight tracker" />
    <meta property="og:description" content="Explore the aircraft above you, follow a flight across the map, or inspect traffic around an airport." />
    <meta property="og:image" content="https://opensky-flight-tracking.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="dark light" />
    <!-- Paint the theme's background before the app loads, without a white flash. -->
    <style>html { background: #0b0b0c; } @media (prefers-color-scheme: light) { html { background: #f5f5f7; } }</style>
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint; the system font shows until Inter arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <noscript>SkyTrace needs JavaScript to draw the live map and load flights.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
